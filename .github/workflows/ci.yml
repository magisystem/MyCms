name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-test:
    name: Build e test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SQL Server effimero per i test di integrazione (ADR-0012). La password serve solo a questo container
    # temporaneo, raggiungibile soltanto dal job: non è un segreto dell'applicazione.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_DvCms_Effimera_7x!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_DvCms_Effimera_7x!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      DVCMS_CONNESSIONE_TEST: "Server=localhost,1433;User Id=sa;Password=Ci_DvCms_Effimera_7x!;TrustServerCertificate=True;Encrypt=False"
    steps:
      # Checkout parziale: la cartella admin-theme (kit grafico, centinaia di MB) non serve alla build.
      # frontend/page-builder/test contiene i vettori del testo formattato condivisi con i test .NET.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            tests
            frontend/page-builder/test

      - name: Installa .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DvCms.sln

      # Dipendenze con vulnerabilità note (anche transitive): il job fallisce se ce n'è almeno una (G-005).
      - name: Verifica vulnerabilità delle dipendenze
        run: |
          dotnet list DvCms.sln package --vulnerable --include-transitive 2>&1 | tee vulnerabilita.txt
          if grep -q "has the following vulnerable packages" vulnerabilita.txt; then
            echo "::error::Dipendenze con vulnerabilità note: vedi l'elenco sopra."
            exit 1
          fi

      - name: Verifica formattazione
        run: dotnet format DvCms.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build DvCms.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution DvCms.sln --configuration Release --no-build

  # Il bundle del page builder (ADR-0007) è versionato perché in produzione non serve Node: qui si verifica che corrisponda
  # ai sorgenti e al lockfile, e che le dipendenze npm non abbiano vulnerabilità note.
  bundle-page-builder:
    name: Bundle del page builder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend/page-builder
            src/DvCms.Web/wwwroot/lib/page-builder

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze dal lockfile
        working-directory: frontend/page-builder
        run: npm ci --no-audit --no-fund

      - name: Verifica vulnerabilità delle dipendenze
        working-directory: frontend/page-builder
        run: npm audit --audit-level=high

      # Grammatica del testo formattato dell'editor, con gli stessi vettori dei test .NET.
      - name: Test del testo formattato
        working-directory: frontend/page-builder
        run: npm test

      - name: Verifica che il bundle versionato sia aggiornato
        working-directory: frontend/page-builder
        run: npm run verifica
